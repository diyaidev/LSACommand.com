<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) — LSA Command -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CSQW3SMTL4"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-CSQW3SMTL4', {
            // Keep campaign + ad-click params (UTMs, gclid) so GA4 can attribute traffic; drop everything else.
            page_location: (function () { var u = new URL(window.location.href), keep = new URLSearchParams(); ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'utm_id', 'gclid', 'gbraid', 'wbraid'].forEach(function (k) { var v = u.searchParams.get(k); if (v) keep.set(k, v); }); var q = keep.toString(); return u.origin + u.pathname + (q ? '?' + q : ''); })(),
            page_referrer: document.referrer.split(/[?#]/)[0],
            linker: { domains: ['lsacommand.com', 'ryan.diyai.ai'] }
        });
    </script>
    <script src="/lsa-tracking.js" defer></script>
    <script>
        // Short link (YouTube descriptions, emails): count the visit in GA4, then go to the calendar.
        // UTMs on this link are passed through so the booking record keeps the campaign.
        (function () {
            var target = new URL('https://ryan.diyai.ai/30-min-discovery-call');
            var here = new URLSearchParams(window.location.search);
            ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
                if (here.get(k)) target.searchParams.set(k, here.get(k));
            });
            var gone = false;
            function go() { if (gone) return; gone = true; window.location.replace(target.toString()); }
            gtag('event', 'begin_booking', { link_location: 'discovery-shortlink', event_callback: go, event_timeout: 1200 });
            setTimeout(go, 1500);
        })();
    </script>
